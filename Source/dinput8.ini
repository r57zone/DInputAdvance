# DirectInput (dinput8.dll) -> XInput
# https://github.com/r57zone/DInputAdvance

[XPad]
# 1 = write log to dinput8.log (for debugging)
# 1 = писать лог в dinput8.log (для отладки)
Debug=0

# 1 = always report the controller as present (supports hot-plugging)
# 1 = всегда сообщать игре о наличии джойстика (поддержка горячего подключения)
AlwaysPresent=1

# Left stick dead zone, % of full deflection (0..99)
# Мёртвая зона левого стика, % от полного отклонения (0..99)
DeadZone=24

# LT/RT button activation threshold, % of full pull (0..99)
# Порог срабатывания LT/RT как кнопок, % от полного нажатия (0..99)
TriggerThreshold=24

# Stick threshold for LS-UP / LS-LEFT / RS-UP ... used as buttons, % of full deflection (0..99)
# Порог стика для LS-UP / LS-LEFT / RS-UP ... как кнопок, % от полного отклонения (0..99)
StickThreshold=50

# 1 = map the D-pad to X/Y axes (in addition to POV)
# 1 = дублировать крестовину на осях X/Y (помимо POV)
DpadToAxes=1

# 1 = send keyboard keys only while the game window is active
# 1 = отправлять клавиши только когда окно игры активно
KeysOnlyInForeground=1

# Vibration intensity multiplier, %
# Множитель интенсивности вибрации, %
RumbleScale=100

# Number of joystick buttons reported to the game (grows automatically if JOYn is larger)
# Количество кнопок джойстика, сообщаемых игре (само увеличится, если указан JOYn больше)
Buttons=12

[Buttons]
# Every gamepad button is bound to ONE target:
#   JOY1..JOY32       - joystick button of the virtual DirectInput gamepad
#   key name          - keyboard key, pressed with SendInput:
#                       A..Z, 0..9, F1..F24, ESCAPE, ENTER, SPACE, TAB, BACKSPACE,
#                       UP, DOWN, LEFT, RIGHT, NUMPAD0..NUMPAD9, NUMPAD-PLUS, NUMPAD-ENTER,
#                       SHIFT, CTRL, ALT, INSERT, DELETE, HOME, END, PAGE-UP, PAGE-DOWN, ...
#                       (or 0x41 = hex virtual-key code)
#   NONE              - disabled
# Example: LB=A  (LB presses the A key on the keyboard)
#
# Каждая кнопка геймпада назначается на ОДНУ цель:
#   JOY1..JOY32       - кнопка джойстика виртуального DirectInput-геймпада
#   имя клавиши       - клавиша клавиатуры, нажимается через SendInput:
#                       A..Z, 0..9, F1..F24, ESCAPE, ENTER, SPACE, TAB, BACKSPACE,
#                       UP, DOWN, LEFT, RIGHT, NUMPAD0..NUMPAD9, NUMPAD-PLUS, NUMPAD-ENTER,
#                       SHIFT, CTRL, ALT, INSERT, DELETE, HOME, END, PAGE-UP, PAGE-DOWN, ...
#                       (или 0x41 = hex VK-код)
#   NONE              - отключено
# Пример: LB=A  (LB нажимает клавишу A на клавиатуре)
A=JOY4
B=JOY5
X=JOY1
Y=JOY2
LB=A
RB=JOY10
BACK=JOY12
START=JOY12
LS=NONE
RS=NONE
LT=JOY7
RT=JOY8

# D-pad as buttons (it always works as POV/axes too). Default: NONE
# Крестовина как кнопки (как POV/оси она работает всегда). По умолчанию: NONE
UP=NONE
DOWN=NONE
LEFT=NONE
RIGHT=NONE

# Sticks as buttons (the left stick keeps working as axes too). Default: NONE
# Стики как кнопки (левый стик как оси работает всегда). По умолчанию: NONE
LS-UP=NONE
LS-DOWN=NONE
LS-LEFT=NONE
LS-RIGHT=NONE
RS-UP=NONE
RS-DOWN=NONE
RS-LEFT=NONE
RS-RIGHT=NONE
